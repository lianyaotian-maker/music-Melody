<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>钢琴即兴伴奏思维导图</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&display=swap">
<style>
:root{
  --bg:#EDF0F5;--surface:#FFFFFF;--surface2:#F5F7FA;--ink:#1A2030;--muted:#586174;--line:#D3D9E3;--bar:rgba(237,240,245,.92);
  --key-w:#FFFFFF;--key-b:#232838;--key-line:#8E97A8;--key-ink:#1A2030;--key-bink:#FFFFFF;
  --hl1:#F6B4C3;--hl1b:#C0264A;--hl2:#C9CDF7;--hl2b:#4B50C8;--hl3:#F9D89E;--hl3b:#BF7A0E;
  --key:#C0264A;--hard:#5B3FC4;--on-tag:#FFFFFF;
  --tbgS:70%;--tbgL:94%;--tfgS:55%;--tfgL:30%;--tlnS:45%;--tlnL:62%;
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12151C;--surface:#1B2029;--surface2:#161A22;--ink:#E6E9EF;--muted:#9CA4B4;--line:#2E3543;--bar:rgba(18,21,28,.92);
    --key-w:#DDE1E8;--key-b:#06070A;--key-line:#4B5364;--key-ink:#141923;--key-bink:#FFFFFF;
    --hl1:#EF94A8;--hl1b:#E04A6B;--hl2:#A6ABF3;--hl2b:#6C72E8;--hl3:#EBC67E;--hl3b:#D3962A;
    --key:#F0668A;--hard:#A08CF7;--on-tag:#12151C;
    --tbgS:26%;--tbgL:19%;--tfgS:70%;--tfgL:78%;--tlnS:38%;--tlnL:48%;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12151C;--surface:#1B2029;--surface2:#161A22;--ink:#E6E9EF;--muted:#9CA4B4;--line:#2E3543;--bar:rgba(18,21,28,.92);
  --key-w:#DDE1E8;--key-b:#06070A;--key-line:#4B5364;--key-ink:#141923;--key-bink:#FFFFFF;
  --hl1:#EF94A8;--hl1b:#E04A6B;--hl2:#A6ABF3;--hl2b:#6C72E8;--hl3:#EBC67E;--hl3b:#D3962A;
  --key:#F0668A;--hard:#A08CF7;--on-tag:#12151C;
  --tbgS:26%;--tbgL:19%;--tfgS:70%;--tfgL:78%;--tlnS:38%;--tlnL:48%;
  color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 -apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
:focus-visible{outline:2px solid var(--hl2b);outline-offset:2px}
.wrap{max-width:780px;margin:0 auto;padding:0 16px}

/* hero */
.hero{padding-top:28px;padding-bottom:6px}
.hero h1{font-family:var(--serif);font-weight:900;font-size:clamp(28px,7.5vw,42px);line-height:1.2;margin:0 0 8px;letter-spacing:.01em}
.goal{margin:0;color:var(--muted)}
.formula{display:flex;align-items:stretch;gap:6px;margin:16px 0 6px}
.fx{flex:1 1 0;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.fx b{display:block;font-family:var(--serif);font-size:17px;line-height:1.35}
.fx span{font-size:12px;color:var(--muted)}
.plus{align-self:center;color:var(--muted);font-weight:700}
.ov{display:block;width:100%;max-width:520px;margin:4px auto 0;height:auto}
.ovl{fill:none;stroke:hsl(var(--h) var(--tlnS) var(--tlnL));stroke-width:2.5}
.ovn{cursor:pointer}
.ovn rect{fill:hsl(var(--h) var(--tbgS) var(--tbgL));stroke:hsl(var(--h) var(--tlnS) var(--tlnL));stroke-width:1.5}
.ovn:hover rect,.ovn:focus-visible rect{stroke-width:3}
.ovn:focus{outline:none}
.ovn text{fill:hsl(var(--h) var(--tfgS) var(--tfgL));font-size:14px;font-weight:700;text-anchor:middle}
.ovc{fill:var(--ink)}
.ovct{fill:var(--bg);font-family:var(--serif);font-size:21px;font-weight:900;text-anchor:middle}
.hint{font-size:13px;color:var(--muted);text-align:center;margin:0 0 8px}
.legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:0 0 14px}
.legend span{display:inline-flex;align-items:center;gap:5px}

/* toolbar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bar);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;gap:8px;padding-top:10px;padding-bottom:10px;overflow-x:auto}
.btn{flex:none;font:inherit;font-size:14px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* branches */
main{padding:6px 0 24px}
.branch{--tbg:hsl(var(--h) var(--tbgS) var(--tbgL));--tfg:hsl(var(--h) var(--tfgS) var(--tfgL));--tln:hsl(var(--h) var(--tlnS) var(--tlnL));margin:12px 0;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--tln);border-radius:14px;overflow:hidden}
.bhead{width:100%;display:flex;align-items:center;gap:12px;padding:12px 12px;background:none;border:0;color:inherit;text-align:left;cursor:pointer;font:inherit}
.bicon{width:42px;height:42px;border-radius:12px;background:var(--tbg);display:grid;place-items:center;font-size:21px;flex:none}
.bt{flex:1;min-width:0;display:flex;flex-direction:column}
.btitle{font-family:var(--serif);font-weight:900;font-size:19px;line-height:1.3;color:var(--tfg)}
.bsum{font-size:13px;color:var(--muted);line-height:1.45}
.bmeta{font-size:11px;color:var(--muted);text-align:right;line-height:1.4;flex:none}
.chev{flex:none;width:18px;color:var(--tfg);font-weight:800;font-size:19px;line-height:1.2;text-align:center;transition:transform .2s}
button[aria-expanded="true"]>.chev{transform:rotate(90deg)}
.bbody{padding:0 12px 14px 6px}

/* mind-map tree */
.tree{list-style:none;margin:0;padding:0 0 0 6px}
.tree>li{position:relative;padding:4px 0 4px 16px}
.tree>li::before{content:"";position:absolute;left:0;top:0;bottom:0;border-left:2px solid var(--tln)}
.tree>li:last-child::before{bottom:auto;height:23px}
.tree>li::after{content:"";position:absolute;left:0;top:23px;width:12px;border-top:2px solid var(--tln)}
.nrow{display:flex;align-items:flex-start;gap:8px;width:100%;text-align:left;font:inherit;color:inherit;background:var(--tbg);border:0;border-radius:10px;padding:7px 10px;min-height:38px}
button.nrow{cursor:pointer}
.lv2>button.nrow .ntext{font-weight:600}
.lv3>.nrow{background:transparent;padding:4px 6px;min-height:0}
.lv3::after{top:19px!important}
.tree>li.lv3:last-child::before{height:19px}
.ntext{flex:1;min-width:0;line-height:1.55}
.dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--tln);margin-top:9px}
.tags{display:inline-flex;gap:4px;margin-left:6px;vertical-align:2px;flex-wrap:wrap}
.tag{font-size:11px;line-height:1;padding:3px 6px;border-radius:6px;font-weight:700;color:var(--on-tag)}
.tag.key{background:var(--key)}
.tag.hard{background:var(--hard)}
.figm{font-size:12px;line-height:1}
.nbody{padding:6px 0 4px 4px}
.nbody>p{margin:4px 0 10px;font-size:14.5px}
.filtering .tree>li[data-t="0"]{display:none}

/* figures */
.fig{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px;margin:6px 0 10px;overflow-x:auto}
.cap{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.6}
.kh{font-size:13px;font-weight:700;margin-bottom:4px}
.kh small{font-weight:400;color:var(--muted)}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kbd,.svgf{width:100%;height:auto;display:block}
.kw{fill:var(--key-w);stroke:var(--key-line);stroke-width:1}
.kb{fill:var(--key-b)}
.kw.h1{fill:var(--hl1)}.kw.h2{fill:var(--hl2)}.kw.h3{fill:var(--hl3)}
.kb.h1{fill:var(--hl1b)}.kb.h2{fill:var(--hl2b)}.kb.h3{fill:var(--hl3b)}
.kt{font-size:10px;font-weight:800;text-anchor:middle;fill:var(--key-ink)}
.kbt{fill:var(--key-bink);font-size:7.5px}
.arc{fill:none;stroke:var(--muted);stroke-width:1.2}
.arc1{stroke:var(--key)}
.st{font-size:9.5px;text-anchor:middle;fill:var(--muted)}
.st1{fill:var(--key);font-weight:800}
.tw{overflow-x:auto}
.tbl{border-collapse:collapse;width:100%;font-size:13px}
.tbl th,.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{color:var(--muted);font-weight:600;white-space:nowrap}
.tbl td:first-child{font-weight:700;white-space:nowrap}
.tbl tr.kr td{background:var(--tbg)}
.kd{color:var(--key);margin-right:3px}
.dia th,.dia td,.mx th,.mx td{text-align:center;padding:6px 4px}
.dia td:first-child,.mx td:first-child{text-align:left}
.fT{--h:160}.fS{--h:40}.fD{--h:350}
.ftone{background:hsl(var(--h) var(--tbgS) var(--tbgL));color:hsl(var(--h) var(--tfgS) var(--tfgL))}
.fchip{display:inline-block;min-width:22px;border-radius:5px;font-weight:800;font-size:12px}
.dotc{display:inline-block;width:12px;height:12px;border-radius:50%;background:hsl(var(--h) var(--tlnS) var(--tlnL))}
.mx small{font-weight:400;color:var(--muted)}
.road{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rstep{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;position:relative}
.rstep input{position:absolute;opacity:0;width:1px;height:1px}
.rnum{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;border:2px solid var(--tln);color:var(--tfg);font-size:14px}
.rstep input:checked+.rnum{background:var(--tln);color:var(--surface)}
.rstep input:focus-visible+.rnum{outline:2px solid var(--hl2b);outline-offset:2px}
.rstep:has(input:checked) .rh b{text-decoration:line-through;text-decoration-color:var(--tln)}
.rtxt{display:flex;flex-direction:column;gap:2px;font-size:14px;line-height:1.55}
.rh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.rh em{font-style:normal;font-size:12px;color:var(--muted)}
.rok{font-size:12.5px;color:var(--tfg)}
.prog{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.ph{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.pg{display:grid;gap:4px;align-items:center}
.pl{font-size:11px;color:var(--muted);white-space:nowrap}
.pr{font-size:11px;text-align:center;color:var(--muted);font-weight:700}
.chip{display:inline-block;font-size:12.5px;font-weight:800;text-align:center;border-radius:6px;padding:5px 0;white-space:nowrap;overflow:hidden}
.chip.nt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.pf{font-size:12.5px;color:var(--muted);margin-top:6px}
.flow{list-style:none;margin:0;padding:0}
.flow li{display:flex;gap:10px;align-items:flex-start;position:relative;padding:0 0 12px}
.flow li:not(:last-child)::after{content:"";position:absolute;left:13px;top:30px;bottom:2px;border-left:2px dashed var(--line)}
.fn{flex:none;width:28px;height:28px;border-radius:50%;background:var(--tbg);color:var(--tfg);border:2px solid var(--tln);display:grid;place-items:center;font-weight:800;font-size:13px}
.flow small,.dl small{color:var(--muted);font-size:12.5px}
.jh{font-size:13px;font-weight:700;margin:2px 0 6px}
.jp{display:grid;grid-template-columns:repeat(4,1fr);border-left:2px solid var(--ink);margin-bottom:14px}
.jbar{border-right:2px solid var(--ink);padding:0 3px}
.jc{display:grid;grid-template-columns:1fr 1fr;font-size:12px;font-weight:800;color:var(--hard);min-height:20px;text-align:center;white-space:nowrap}
.jn{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.js{color:var(--key);font-weight:800}
.grid{margin:4px 0 16px}
.gtitle{font-weight:700;font-size:14px;margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.meter{font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:var(--surface)}
.gg{display:grid;gap:3px}
.gh{text-align:center;font-size:11px;color:var(--muted)}
.gh.gs{color:var(--ink);font-weight:800}
.gl{font-size:12px;color:var(--muted);align-self:center}
.gc{height:32px;border-radius:6px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:800}
.gc.on.t1{background:var(--hl1b);color:#FFFFFF;border-color:transparent}
.gc.on.t2{background:var(--hl2b);color:#FFFFFF;border-color:transparent}
.gc.hold{background:linear-gradient(var(--hl1),var(--hl1)) center/100% 6px no-repeat,var(--surface)}
.bm{display:flex;align-items:flex-end;gap:10px;margin-bottom:12px}
.bm .meter{margin-bottom:20px}
.bb{flex:1;display:flex;gap:4px;height:70px;align-items:stretch}
.bcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;text-align:center}
.bv{background:var(--tln);border-radius:4px 4px 0 0;min-height:6px}
.bcol span{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.2}
.sl{font-size:12px;fill:var(--muted);font-weight:700}
.pbox{fill:var(--hl2)}
.pt{font-size:14px;font-weight:800;text-anchor:middle;fill:var(--key-ink)}
.pdash{stroke:var(--muted);stroke-dasharray:3 3}
.pline{fill:none;stroke:var(--key);stroke-width:2.5;stroke-linejoin:round}
.sn{font-size:11px;fill:var(--muted)}
.axis{stroke:var(--line);stroke-width:1.5}
.earea{fill:var(--hl1);opacity:.45}
.eline{fill:none;stroke:var(--key);stroke-width:2.5;stroke-linejoin:round}
.edot{fill:var(--surface);stroke:var(--key);stroke-width:2}
.edot.ech{fill:var(--key)}
.elab{font-size:10px;text-anchor:middle;fill:var(--muted)}
.elab.ech2{fill:var(--key);font-weight:800}
.enote{font-size:11px;text-anchor:middle;fill:var(--key);font-weight:800}
.fcirc{fill:hsl(var(--h) var(--tbgS) var(--tbgL));stroke:hsl(var(--h) var(--tlnS) var(--tlnL));stroke-width:2}
.ftxt{fill:hsl(var(--h) var(--tfgS) var(--tfgL));text-anchor:middle;font-weight:800}
.fbig{font-size:24px}.fsm{font-size:11px;font-weight:600}
.fch{font-size:13px;font-weight:800;text-anchor:middle;fill:var(--ink)}
.fde{font-size:11px;text-anchor:middle;fill:var(--muted)}
.farr{fill:none;stroke:var(--muted);stroke-width:2}
.ahp{fill:var(--muted)}
.bch{font-size:12px;font-weight:800;text-anchor:middle;fill:var(--hard)}
.bstep{fill:var(--key)}
.bnote{font-size:11px;text-anchor:middle;fill:var(--muted);font-weight:700}
.bpath{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 3;opacity:.6}
.c5o{fill:var(--surface);stroke:var(--line)}
.c5c{fill:hsl(40 var(--tbgS) var(--tbgL))}
.c5i{fill:var(--surface2);stroke:var(--line)}
.c5ctr{fill:var(--ink)}
.c5t{fill:var(--bg);font-size:12px;text-anchor:middle;font-weight:700}
.c5M{font-size:14px;font-weight:800;text-anchor:middle;fill:var(--ink)}
.c5s{font-size:9px;text-anchor:middle;fill:var(--muted)}
.c5m{font-size:11px;text-anchor:middle;fill:var(--muted)}
.sd{display:grid;gap:6px}
.sdr{display:flex;align-items:center;gap:8px}
.sdr .chip,.sdx .chip{min-width:46px;padding:5px 8px}
.sar{color:var(--muted)}
.sdr small{color:var(--muted);font-size:12px}
.sdx{display:flex;gap:6px;margin:4px 0}
.dbar{display:flex;height:34px;border-radius:8px;overflow:hidden;gap:2px}
.dseg{display:grid;place-items:center;font-size:12px;font-weight:800;background:hsl(var(--h) var(--tbgS) var(--tbgL));color:hsl(var(--h) var(--tfgS) var(--tfgL));border:1px solid hsl(var(--h) var(--tlnS) var(--tlnL))}
.dl{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:6px;font-size:13.5px}
.dl li{display:flex;gap:8px}
.dsw{flex:none;width:10px;height:10px;border-radius:3px;margin-top:7px;background:hsl(var(--h) var(--tlnS) var(--tlnL))}
.foot{color:var(--muted);font-size:13px;text-align:center;padding-top:4px;padding-bottom:28px}
@media (max-width:420px){
  .bbody{padding:0 8px 12px 2px}
  .fig{padding:10px}
  .bmeta{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="wrap hero">
  <h1>钢琴即兴伴奏<br>思维导图</h1>
  <p class="goal">目标：拿到一首流行歌，能即兴弹出有层次、节奏稳的完整伴奏。</p>
  <div class="formula" aria-label="即兴伴奏的三要素">
    <div class="fx"><b>和弦</b><span>弹什么音</span></div><span class="plus">+</span>
    <div class="fx"><b>织体节奏</b><span>怎么弹</span></div><span class="plus">+</span>
    <div class="fx"><b>编配</b><span>何时变化</span></div>
  </div>
  <div id="overview"></div>
  <p class="hint">点任意分支直接跳过去；建议从“学习路线”开始顺时针学。</p>
  <div class="legend">
    <span><span class="tag key">重点</span>必须掌握</span>
    <span><span class="tag hard">难点</span>需要多练</span>
    <span>📊 含图解</span>
  </div>
</header>
<nav class="bar" aria-label="视图控制">
  <div class="wrap">
    <button class="btn" type="button" data-act="open">全部展开</button>
    <button class="btn" type="button" data-act="close">全部收起</button>
    <button class="btn" type="button" data-act="filter" aria-pressed="false">只看重点和难点</button>
  </div>
</nav>
<main class="wrap" id="map"></main>
<p class="wrap foot">每学完一个分支，就拿一首真实的歌弹一遍。</p>

<script>
const LSK='piano-acc-roadmap';

/* ---------- helpers ---------- */
const PCN={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function mid(n){const r=/^([A-G])([#b]?)(\d)$/.exec(n);return PCN[r[1]]+(r[2]==='#'?1:r[2]==='b'?-1:0)+12*(+r[3]+1);}
const isBlk=p=>[1,3,6,8,10].includes(p%12);
function kb(o){
  const from=mid(o.from),to=mid(o.to),W=24,H=92,BW=15,BH=58,top=o.steps?24:2;
  const hl={};for(const k in (o.hl||{}))hl[mid(k)]=o.hl[k];
  const wh=[],bl=[],cx={};let x=0;
  for(let p=from;p<=to;p++){
    if(!isBlk(p)){wh.push({p,x});cx[p]=x+W/2;x+=W;}
    else{bl.push({p,x:x-BW/2});cx[p]=x;}
  }
  const w=x;
  let s=`<svg class="kbd" viewBox="-1 ${-top} ${w+2} ${H+top+2}" style="max-width:${Math.round((w+2)*1.55)}px" role="img" aria-label="${o.aria||'键盘示意图'}">`;

TREE.forEach((b,i)=>{b.h=(210+i*30)%360;});

/* ---------- render ---------- */
let uid=0;
const hasTag=n=>!!n.tag||(n.c||[]).some(hasTag);
const countN=n=>(n.c||[]).reduce((a,x)=>a+1+countN(x),0);
const countF=n=>(n.c||[]).reduce((a,x)=>a+(x.fig?1:0)+countF(x),0);
function tagsHTML(n){
  let s='';
  if(n.tag){if(n.tag.includes('key'))s+='<span class="tag key">重点</span>';if(n.tag.includes('hard'))s+='<span class="tag hard">难点</span>';}
  if(n.fig)s+='<span class="figm" title="含图解">📊</span>';
  return s?`<span class="tags">${s}</span>`:'';
}
function nodeHTML(n,lv){
  const ht=hasTag(n)?1:0;
  if(!(n.d||n.fig||n.c))return `<li class="lv${lv}" data-t="${ht}"><div class="nrow"><span class="dot"></span><span class="ntext">${n.t}${tagsHTML(n)}</span></div></li>`;
  const id='n'+(++uid);
  let body='';
  if(n.d)body+=`<p>${n.d}</p>`;
  if(n.fig)body+=`<div class="fig">${FIG[n.fig]()}</div>`;
  if(n.c)body+=`<ul class="tree">${n.c.map(x=>nodeHTML(x,lv+1)).join('')}</ul>`;
  return `<li class="lv${lv}" data-t="${ht}"><button type="button" class="nrow" aria-expanded="false" aria-controls="${id}"><span class="chev" aria-hidden="true">›</span><span class="ntext">${n.t}${tagsHTML(n)}</span></button><div class="nbody" id="${id}" hidden>${body}</div></li>`;
}
function branchHTML(b){
  const f=countF(b);
  return `<section class="branch" id="${b.id}" style="--h:${b.h}"><button type="button" class="bhead" aria-expanded="false" aria-controls="${b.id}-b"><span class="bicon" aria-hidden="true">${b.icon}</span><span class="bt"><span class="btitle">${b.t}</span><span class="bsum">${b.sum}</span></span><span class="bmeta">${countN(b)} 个要点${f?`<br>${f} 张图解`:''}</span><span class="chev" aria-hidden="true">›</span></button><div class="bbody" id="${b.id}-b" hidden><ul class="tree">${b.c.map(n=>nodeHTML(n,2)).join('')}</ul></div></section>`;
}
function overview(){
  const cx=200,cy=200,R=150,n=TREE.length;
  let lines='',nodes='';
  TREE.forEach((b,i)=>{
    const a=(-90+i*360/n)*Math.PI/180,x=cx+R*Math.cos(a),y=cy+R*Math.sin(a);
    const qa=a+0.22,qx=cx+92*Math.cos(qa),qy=cy+92*Math.sin(qa);
    lines+=`<path d="M${(cx+52*Math.cos(a)).toFixed(1)} ${(cy+52*Math.sin(a)).toFixed(1)} Q${qx.toFixed(1)} ${qy.toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)}" class="ovl" style="--h:${b.h}"/>`;
    nodes+=`<g class="ovn" style="--h:${b.h}" data-go="${b.id}" tabindex="0" role="button" aria-label="跳到 ${b.t}"><rect x="${(x-35).toFixed(1)}" y="${(y-16).toFixed(1)}" width="70" height="32" rx="16"/><text x="${x.toFixed(1)}" y="${(y+5).toFixed(1)}">${b.t}</text></g>`;
  });
  return `<svg viewBox="0 0 400 400" class="ov" role="group" aria-label="思维导图总览">${lines}<circle cx="${cx}" cy="${cy}" r="54" class="ovc"/><text x="${cx}" y="${cy-4}" class="ovct">即兴</text><text x="${cx}" y="${cy+22}" class="ovct">伴奏</text>${nodes}</svg>`;
}

const map=document.getElementById('map');
document.getElementById('overview').innerHTML=overview();
map.innerHTML=TREE.map(branchHTML).join('');

function setOpen(b,o){b.setAttribute('aria-expanded',o?'true':'false');const t=document.getElementById(b.getAttribute('aria-controls'));if(t)t.hidden=!o;}
function goTo(id){
  const sec=document.getElementById(id);if(!sec)return;
  setOpen(sec.querySelector('.bhead'),true);
  const rm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  sec.scrollIntoView({behavior:rm?'auto':'smooth',block:'start'});
}
setOpen(document.querySelector('#road .bhead'),true);

document.addEventListener('click',e=>{
  const go=e.target.closest('[data-go]');if(go){goTo(go.dataset.go);return;}
  const act=e.target.closest('[data-act]');
  if(act){
    const a=act.dataset.act;
    if(a==='open')map.querySelectorAll('button[aria-expanded]').forEach(b=>setOpen(b,true));
    if(a==='close')map.querySelectorAll('button[aria-expanded]').forEach(b=>setOpen(b,false));
    if(a==='filter'){
      const on=act.getAttribute('aria-pressed')!=='true';
      act.setAttribute('aria-pressed',on?'true':'false');
      map.classList.toggle('filtering',on);
      if(on)map.querySelectorAll('button[aria-expanded]').forEach(b=>setOpen(b,true));
    }
    return;
  }
  const b=e.target.closest('button[aria-expanded]');
  if(b)setOpen(b,b.getAttribute('aria-expanded')!=='true');
});
document.addEventListener('keydown',e=>{
  const go=e.target.closest&&e.target.closest('[data-go]');
  if(go&&(e.key==='Enter'||e.key===' ')){e.preventDefault();goTo(go.dataset.go);}
});
document.addEventListener('change',e=>{
  if(!e.target.matches('[data-road]'))return;
  const d={};document.querySelectorAll('[data-road]').forEach(c=>{if(c.checked)d[c.dataset.road]=1;});
  try{localStorage.setItem(LSK,JSON.stringify(d));}catch(err){}
});
</script>
